[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reasoning-rl-lab"
version = "0.1.0"
description = "Reproducible small-model reasoning post-training and difficulty-aware GRPO sampling"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers==4.57.1", "peft==0.17.1", "trl==0.23.1",
  "accelerate==1.10.1", "datasets==4.1.1", "numpy==2.2.6",
  "PyYAML==6.0.2", "safetensors==0.6.2", "matplotlib==3.10.6",
  "scikit-learn==1.7.2", "pytest==8.4.2", "psutil==7.1.0"
]

[project.scripts]
rrl = "reasoning_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
