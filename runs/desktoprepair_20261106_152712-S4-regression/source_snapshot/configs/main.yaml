# Provisional capacity caps: resize using pilot throughput BEFORE freezing final protocol.
stage: main_provisional
model: qwen3_17b
dtype: bfloat16
quantization: nf4
seed: 13
data_seed: 20261105
lora:
  r: 8
  alpha: 16
  target_modules: [q_proj, v_proj]
generation:
  max_prompt_length: 512
  max_new_tokens: 512
  temperature: 0.8
  top_p: 0.95
  top_k: 20
sft:
  pool_size: 2048
  steps: 256
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  max_length: 1024
grpo:
  pool_size: 128
  steps: 100000
  gradient_accumulation_steps: 4
  num_generations: 4
  learning_rate: 0.000005
  loss_type: grpo
  scale_rewards: group
  beta: 0.0
  epsilon: 0.2
  uniform_mix: 0.25
  prior: 0.5
  probe_samples: 4
  refresh_interval: 25
  validation_interval: 50
  max_wall_seconds: 7200
  max_accounted_tokens: 5000000
evaluation:
  validation_size: 64
  test_size: null
  external_size: null
