# Enlarged local development run; not a frozen main/test protocol.
stage: local_pilot
model: qwen3_17b
dtype: bfloat16
quantization: nf4
seed: 13
data_seed: 20261105
lora:
  r: 8
  alpha: 16
  target_modules: [q_proj, v_proj]
generation:
  max_prompt_length: 512
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.95
  top_k: 20
sft:
  pool_size: 128
  steps: 32
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  max_length: 768
grpo:
  pool_size: 16
  # Predetermined random training slice, outside the 128-example SFT pool.
  pool_offset: 128
  require_disjoint_from_sft: true
  steps: 100000
  gradient_accumulation_steps: 4
  num_generations: 4
  learning_rate: 0.000005
  loss_type: grpo
  scale_rewards: group
  beta: 0.0
  epsilon: 0.2
  uniform_mix: 0.25
  prior: 0.5
  probe_samples: 2
  refresh_interval: 8
  validation_interval: 100000
  max_wall_seconds: 1200
  # Calibrate this reserve from the A/B validation timing before GRPO starts.
  final_validation_reserve_seconds: 300
  max_accounted_tokens: 1000000
evaluation:
  validation_size: 32
  test_size: null
  external_size: null
